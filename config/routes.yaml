# Discover #[Route] attributes on the OAuth controllers. Without this
# Symfony has no idea where /contao/oauth/authorize etc. live.
netzhirsch_contao_mcp_oauth:
    resource: '../src/Controller/OAuth/'
    type: attribute

# The bare /.well-known OAuth documents. The endpoint itself (/mcp by
# default), its /healthz probe and the path-suffixed .well-known documents
# follow `path` in var/mcp/config.json, so they are no attribute routes:
# McpEndpointRouteListener matches them, and a path saved in the backend
# applies without a cache:clear.
netzhirsch_contao_mcp_controller:
    resource: '../src/Controller/McpController.php'
    type: attribute
